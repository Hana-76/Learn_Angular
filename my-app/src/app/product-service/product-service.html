<div *ngFor="let category of categories" class="category-container">
  <!-- Bảng Danh mục -->
  <table border = "1" class="category-table">
    <thead>
      <tr>
        <th>Ma Danh Muc</th>
        <th>Ten Danh Muc</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ category.id }}</td>
        <td>{{ category.name }}</td>
      </tr>
    </tbody>
  </table>

  <!-- Bảng Sản phẩm thuộc Danh mục -->
  <table border ="1" class="product-table">
    <thead>
      <tr>
        <th>Ma San Pham</th>
        <th>Ten San Pham</th>
        <th>Gia San Pham</th>
        <th>Picture</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of category.products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
        <td>
          <img [src]="product.imageUrl" [alt]="product.name" width="60" />
        </td>
      </tr>
    </tbody>
  </table>
</div>
